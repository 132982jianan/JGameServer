# 各节点端口段：实际端口 = base + portOffset + nodeId - 1
portRange:
  portal:
    artery: 20000
    http: 80
  gate:
    artery: 25000
    tcp: 25001
    ws: 25002
  lobby:
    artery: 30000
  battle:
    artery: 40000
  global:
    artery: 50000
  insight:
    artery: 60000
    http: 9000
# artery/公网 IP 解析：直接指定 > 环境变量 > 网卡前缀匹配 > 127.0.0.1
privateIp:
  envVar: PRIVATE_IP
  prefix:
    - "192."
    - "172."
    - "10."
publicIp:
  envVar: PUBLIC_IP
  prefix:
    - "192."
    - "172."
    - "10."
portOffset:
  envVar: PORT_OFFSET
# akka 通用配置（多节点共用，改 Nacos 即全局生效）
akka:
  loglevel: INFO
  logDeadLetters: 10
