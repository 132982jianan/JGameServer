akka {  
  loglevel = "INFO"
  
  stdout-loglevel = "INFO"
  
  #log-config-on-start = on
  
  actor {
    provider = "akka.remote.RemoteActorRefProvider"
    
    allow-java-serialization = off
    
    serializers {
    	net = "com.jacey.game.common.msg.serializer.NetMessageSerializer"
    	remote = "com.jacey.game.common.msg.serializer.RemoteMessageSerializer"
	}
	
	serialization-bindings {
      "com.jacey.game.common.msg.NetMessage" = net
      "com.jacey.game.common.msg.RemoteMessage" = remote
    }
  }
  
  remote {
    artery {
   		enabled = on
   		transport = tcp
   		canonical {
   			port = 40000
   			hostname = "<getHostAddress>"
   			hostname = ${?AKKA_CANONICAL_HOSTNAME}
   		}
   	}
  }
}

akka.remote.artery.advanced {
	aeron {
		# 降低embedded driver的log buffer占用（/dev/shm受限环境）
		term-buffer-length = 4194304
		term-buffer-sparse-file = true
	}
}
