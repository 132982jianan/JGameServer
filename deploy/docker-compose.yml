name: jgame-server-local

x-node: &node
  image: ${NODE_IMAGE}
  working_dir: /app/bin
  shm_size: 256m
  volumes:
    - ../server/build/libs/server-all.jar:/app/lib/server-all.jar:ro
    - ../common/src/main/resources/conf:/app/conf:ro
    - ./logs:/app/bin/logs
  restart: on-failure

x-node-env: &node-env
  TZ: Asia/Shanghai
  NACOS_HOST: nacos

services:
  nacos:
    image: ${NACOS_IMAGE}
    container_name: jgame-nacos
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: jgame
    volumes:
      - ./data/nacos:/home/nacos/data
      - ./logs/nacos:/home/nacos/logs
    ports:
      - "8848:8848"
      - "9848:9848"
      - "38080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v3/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo:
    image: ${MONGO_IMAGE}
    container_name: jgame-mongo
    volumes:
      - ./data/mongo:/data/db
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost:27017 --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  redis:
    image: ${REDIS_IMAGE}
    container_name: jgame-redis
    volumes:
      - ./data/redis:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  portal:
    <<: *node
    container_name: jgame-portal
    hostname: portal
    command: java -jar ../lib/server-all.jar --kind=portal --id=1
    environment: *node-env
    ports:
      - "8080:80"
      - "20000:20000"
    depends_on:
      nacos: { condition: service_healthy }

  lobby:
    <<: *node
    container_name: jgame-lobby
    hostname: lobby
    command: java -jar ../lib/server-all.jar --kind=lobby --id=1
    environment:
      <<: *node-env
      MONGO_HOST: mongo
    ports: ["30000:30000"]
    depends_on:
      nacos: { condition: service_healthy }
      mongo: { condition: service_healthy }

  global:
    <<: *node
    container_name: jgame-global
    hostname: global
    command: java -jar ../lib/server-all.jar --kind=global --id=1
    environment: *node-env
    ports: ["50000:50000"]
    depends_on:
      nacos: { condition: service_healthy }

  battle:
    <<: *node
    container_name: jgame-battle
    hostname: battle
    command: java -jar ../lib/server-all.jar --kind=battle --id=1
    environment:
      <<: *node-env
      MONGO_HOST: mongo
    ports: ["40000:40000"]
    depends_on:
      nacos: { condition: service_healthy }
      mongo: { condition: service_healthy }

  gate:
    <<: *node
    container_name: jgame-gate
    hostname: gate
    command: java -jar ../lib/server-all.jar --kind=gate --id=1
    environment:
      <<: *node-env
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    ports:
      - "25000:25000"
      - "25002:25002"
    depends_on:
      nacos: { condition: service_healthy }
      lobby: { condition: service_started }
      global: { condition: service_started }

  insight:
    <<: *node
    container_name: jgame-insight
    hostname: insight
    command: java -jar ../lib/server-all.jar --kind=insight --id=1
    environment:
      <<: *node-env
      MONGO_HOST: mongo
      REDIS_HOST: redis
    ports:
      - "60000:60000"
      - "9000:9000"
    depends_on:
      nacos: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
