name: jgame-server-local

x-server-defaults: &server-defaults
  image: ${NODE_IMAGE}
  restart: unless-stopped
  working_dir: /app
  shm_size: 256m
  volumes:
    - ../server/build/libs/server-all.jar:/app/server-all.jar:ro
    - ../game-common/src/main/resources/conf:/app/conf:ro
  networks:
    - jgame-net

services:
  nacos:
    image: ${NACOS_IMAGE}
    container_name: jgame-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - jgame-net

  mongo:
    image: ${MONGO_IMAGE}
    container_name: jgame-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost:27017 --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - jgame-net

  redis:
    image: ${REDIS_IMAGE}
    container_name: jgame-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - jgame-net

  jgame-gm:
    <<: *server-defaults
    container_name: jgame-gm
    hostname: jgame-gm
    command: ["java", "-jar", "server-all.jar", "--kind", "gm"]
    environment:
      NACOS_HOST: nacos
      MONGO_HOST: mongo
      REDIS_HOST: redis
    ports:
      - "8080:80"      # GM HTTP
      - "20000:20000"  # akka artery
    depends_on:
      nacos:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  jgame-logic:
    <<: *server-defaults
    container_name: jgame-logic
    hostname: jgame-logic
    command: ["java", "-jar", "server-all.jar", "--kind", "logic", "--id", "1"]
    environment:
      NACOS_HOST: nacos
      MONGO_HOST: mongo
      REDIS_HOST: redis
    ports:
      - "30000:30000"
    depends_on:
      nacos:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      jgame-gm:
        condition: service_started

  jgame-battle:
    <<: *server-defaults
    container_name: jgame-battle
    hostname: jgame-battle
    command: ["java", "-jar", "server-all.jar", "--kind", "battle", "--id", "1"]
    environment:
      NACOS_HOST: nacos
      MONGO_HOST: mongo
      REDIS_HOST: redis
    ports:
      - "40000:40000"
    depends_on:
      nacos:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      jgame-gm:
        condition: service_started

  jgame-chat:
    <<: *server-defaults
    container_name: jgame-chat
    hostname: jgame-chat
    command: ["java", "-jar", "server-all.jar", "--kind", "chat", "--id", "1"]
    environment:
      NACOS_HOST: nacos
      MONGO_HOST: mongo
      REDIS_HOST: redis
    ports:
      - "50000:50000"
    depends_on:
      nacos:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      jgame-gm:
        condition: service_started

  jgame-gateway:
    <<: *server-defaults
    container_name: jgame-gateway
    hostname: jgame-gateway
    command: ["java", "-jar", "server-all.jar", "--kind", "gateway", "--id", "1"]
    environment:
      NACOS_HOST: nacos
      MONGO_HOST: mongo
      REDIS_HOST: redis
    ports:
      - "10001:10001"  # 客户端 TCP 入口
      - "10002:10002"  # 客户端 WebSocket 入口
      - "10000:10000"  # akka artery
    depends_on:
      nacos:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      jgame-gm:
        condition: service_started

networks:
  jgame-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
